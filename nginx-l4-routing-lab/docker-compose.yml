services:
  nginx-loadbalancer:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      lab_net:
        ipv4_address: 10.15.0.100

  backend_1:
    image: nginx:latest
    volumes:
      - ./backend_1.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      lab_net:
        ipv4_address: 10.15.0.11

  backend_2:
    image: nginx:latest
    volumes:
      - ./backend_2.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
    networks:
      lab_net:
        ipv4_address: 10.15.0.12

  backend_3:
    image: nginx:latest
    volumes:
      - ./backend_3.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      lab_net:
        ipv4_address: 10.15.0.13

networks:
  lab_net:
    ipam:
      config:
        - subnet: 10.15.0.0/24
