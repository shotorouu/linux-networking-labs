services:
  nginx_lb:
    image: nginx:1.31.2
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    networks:
      nginx_net:
        ipv4_address: 10.15.0.100

  backend_1:
    image: nginx:1.31.2
    volumes:
      - ./configs/backend_1.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      nginx_net:
        ipv4_address: 10.15.0.11

  backend_2:
    image: nginx:1.31.2
    volumes:
      - ./configs/backend_2.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      nginx_net:
        ipv4_address: 10.15.0.12

  backend_3:
    image: nginx:1.31.2
    volumes:
      - ./configs/backend_3.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      nginx_net:
        ipv4_address: 10.15.0.13

  api_1:
    image: nginx:1.31.2
    volumes:
      - ./configs/api_1.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      nginx_net:
        ipv4_address: 10.15.0.14

  api_2:
    image: nginx:1.31.2
    volumes:
      - ./configs/api_2.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      nginx_net:
        ipv4_address: 10.15.0.15

networks:
  nginx_net:
    ipam:
      config:
        - subnet: "10.15.0.0/24"
